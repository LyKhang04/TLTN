server:
  port: 8080

# Khong bao gio hardcode API key truc tiep vao file nay - dung bien moi truong.
# --- Cau hinh chatbot "Sanh AI" ---
# ai.provider: gemini | anthropic | auto
#   auto = uu tien nha cung cap nao da co API key (xet Gemini truoc vi co goi mien phi)
ai:
  provider: ${AI_PROVIDER:auto}

# Google Gemini - co goi MIEN PHI, khong can the tin dung.
# Lay API key tai: https://aistudio.google.com/app/apikey
gemini:
  api-key: ${GEMINI_API_KEY:}
  model: gemini-3-flash-preview
  base-url: https://generativelanguage.googleapis.com/v1beta/models

# Anthropic Claude - tra phi theo token, can nap tin dung tai console.anthropic.com
anthropic:
  api-key: ${ANTHROPIC_API_KEY:}
  model: claude-sonnet-5
  base-url: https://api.anthropic.com/v1/messages

spring:
  application:
    name: chungcu

  # Nap them cau hinh rieng cua tung may (mat khau CSDL, khoa API) neu co.
  # Tien to "optional:" nghia la thieu file van chay binh thuong.
  # File backend/application-local.yml da duoc liet ke trong .gitignore.
  config:
    import: optional:file:./application-local.yml

  # =====================================================================
  # MAC DINH: MySQL
  #
  # Truoc khi chay lan dau, nap co so du lieu bang mot trong hai cach:
  #   mysql -u root -p < database/sanh_chungcu_mysql.sql
  #   hoac mo file do bang MySQL Workbench roi nhan Execute.
  #
  # Doi tai khoan MySQL bang bien moi truong, khong sua thang vao file nay:
  #   DB_USERNAME, DB_PASSWORD, DB_HOST, DB_PORT, DB_NAME
  # =====================================================================
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:sanh_chungcu}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh&characterEncoding=UTF-8
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

    # Be ket noi (connection pool) - doc boi lop DataSourceConfig.
    # max-lifetime nen ngan hon wait_timeout cua MySQL (mac dinh 28800000 ms)
    # de tranh dung phai ket noi da bi may chu dong tu phia kia.
    hikari:
      pool-name: SanhChungCuPool
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 10000
      idle-timeout: 300000
      max-lifetime: 900000

  jpa:
    hibernate:
      # none = Hibernate KHONG dung toi cau truc bang. Toan bo schema do file
      # database/sanh_chungcu_mysql.sql quyet dinh, tranh viec Hibernate tu y
      # sua bang khi chay.
      #
      # Muon Hibernate doi chieu entity voi bang moi lan khoi dong thi doi thanh
      # "validate". Luu y: Hibernate 6 rat kho tinh ve kieu cot (Boolean, DECIMAL),
      # nen neu bao loi kieu du lieu thi cu tra ve "none", khong anh huong chuc nang.
      ddl-auto: none
    database-platform: org.hibernate.dialect.MySQLDialect
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  # Khong chay data.sql o profile MySQL vi du lieu da nam san trong CSDL
  sql:
    init:
      mode: never

---
# =====================================================================
# PROFILE "h2" - chay nhanh khong can cai MySQL, du lieu nam trong bo nho.
# Dung khi demo tren may khac hoac khi MySQL gap su co.
#
#   mvn spring-boot:run -Dspring-boot.run.profiles=h2
#   java -jar chungcu.jar --spring.profiles.active=h2
#
# Console xem du lieu: http://localhost:8080/h2-console
#   JDBC URL: jdbc:h2:mem:chungcu   user: sa   (khong mat khau)
# =====================================================================
spring:
  config:
    activate:
      on-profile: h2

  datasource:
    url: jdbc:h2:mem:chungcu;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

    # H2 nam trong bo nho nen chi can be ket noi nho
    hikari:
      pool-name: SanhChungCuPoolH2
      maximum-pool-size: 5
      minimum-idle: 1

  jpa:
    hibernate:
      ddl-auto: create-drop
    defer-datasource-initialization: true
    open-in-view: false
    show-sql: false

  # Nap lai du lieu mau tu data.sql moi lan khoi dong
  sql:
    init:
      mode: always

  h2:
    console:
      enabled: true
      path: /h2-console
