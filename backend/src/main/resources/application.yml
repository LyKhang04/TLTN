server:
  port: 8080

# --- Chatbot AI ho tro cu dan (Sanh AI) ---
# Dat bien moi truong ANTHROPIC_API_KEY truoc khi chay backend de bat tinh nang nay.
# Khong bao gio hardcode API key truc tiep vao file nay.
anthropic:
  api-key: ${ANTHROPIC_API_KEY:}
  model: claude-sonnet-5
  base-url: https://api.anthropic.com/v1/messages

spring:
  application:
    name: chungcu

  # --- Demo/dev: H2 in-memory, tu tao schema + seed du lieu tu data.sql ---
  datasource:
    url: jdbc:h2:mem:chungcu;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: create-drop
    defer-datasource-initialization: true
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  sql:
    init:
      mode: always

  h2:
    console:
      enabled: true
      path: /h2-console

